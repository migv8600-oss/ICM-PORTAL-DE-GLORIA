<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#09090B"/>
  <!-- Golden arch -->
  <path d="M 20 80 C 20 30, 80 30, 80 80" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Radiant cross -->
  <path d="M 50 35 L 50 65" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 38 46 L 62 46" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <defs>
    <linearGradient id="goldGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E5AB" />
      <stop offset="0.5" stop-color="#D4AF37" />
      <stop offset="1" stop-color="#996F08" />
    </linearGradient>
  </defs>
</svg>
